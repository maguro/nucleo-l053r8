[workspace]
resolver = "3"
members = ["board", "examples/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

# These are the shared dependency versions. Each example opts in with
# `foo.workspace = true`.
[workspace.dependencies]
board = { path = "board" }
# unstable-pac: gives access to the peripheral registers. tim-timebase needs it
# to clear the timer flag in its own interrupt handler.
embassy-stm32 = { version = "0.6", features = ["stm32l053r8", "memory-x", "time-driver-any", "exti", "defmt", "unstable-pac"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
# tick-hz-32_768: The time driver divides the timer clock by the tick rate.
# Delays are exact only if this division has no remainder. Each MSI frequency
# is 32768 Hz multiplied by a power of two, so this tick rate is exact for all
# MSI clocks. At 32 MHz, delays are 0.06% short.
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = "0.8"
static_cell = "2"
# critical-section: Cortex-M0+ has no atomic compare-and-swap. static_cell
# needs one, and this feature gives one that disables interrupts for a short
# time.
portable-atomic = { version = "1", features = ["critical-section"] }
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

# The L053R8 has 64 KB flash and 8 KB RAM. Debug info stays on the host, so debug
# info uses no flash. Dev builds do not optimize the workspace crates (`board`
# and the examples), so a debugger can show every local variable and step
# through the code line by line. Dev builds optimize all dependencies for size,
# so the examples still fit.
[profile.dev]
opt-level = 0
debug = 2

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1
